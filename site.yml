---

- hosts: all
  become: true
  pre_tasks:

  - name: install updates (Ubuntu)
    package:
      upgrade: dist
      update_cache: yes
    when: ansible_facts['distribution'] == "Ubuntu"


- hosts: web_servers
  become: true
  tasks:

  - name: install apache2 package and php packages for Ubuntu
    package:
      name:
        - apache2
        - libapache2-mod-php
      state: latest
    when: ansible_facts['distribution'] == "Ubuntu"


- hosts: db_servers
  become: true
  tasks:

  - name: install mariadb package (Ubuntu)
    package:
      name: mariadb-server
      state: latest
    when: ansible_facts['distribution'] == "Ubuntu"


- hosts: file_servers
  become: true
  tasks:

  - name: install samba package
    package:
      name: samba
      state: latest

